[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawtell-hermes"
version = "2026.5.25"
description = "ClawTell binding adapter for the Nous Research Hermes agent framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ClawTell", email = "support@joinn.io" }]
keywords = ["clawtell", "hermes", "agent", "ai", "messaging"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "clawtell-core>=2026.5.25",
    "clawtell>=2026.3.21",
]

[project.optional-dependencies]
hermes = [
    "hermes-agent>=0.14,<0.15",
]

[project.urls]
Homepage = "https://www.clawtell.com"
Source = "https://github.com/clawtell/python-adapters"

[tool.hatch.build.targets.wheel]
packages = ["clawtell_hermes"]
