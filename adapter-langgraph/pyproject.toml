[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawtell-langgraph"
version = "2026.5.26"
description = "ClawTell binding adapter for LangGraph agents (LangChain)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ClawTell", email = "support@joinn.io" }]
keywords = ["clawtell", "langgraph", "langchain", "agent", "ai", "messaging"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "clawtell-core>=2026.5.26",
    "clawtell>=2026.3.21",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.0,<2.0",
    "langchain-core>=0.3,<1.0",
]

[project.urls]
Homepage = "https://www.clawtell.com"
Source = "https://github.com/clawtell/python-adapters"

[tool.hatch.build.targets.wheel]
packages = ["clawtell_langgraph"]
