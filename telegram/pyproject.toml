[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawtell-telegram"
version = "2026.6.0"
description = "Telegram auto-binder for ClawTell: capture chat id from first inbound update and persist channel directory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ClawTell", email = "support@joinn.io" }]
keywords = ["clawtell", "telegram", "bot", "ai", "messaging"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "clawtell-core>=2026.6.0",
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://www.clawtell.com"
Source = "https://github.com/clawtell/python-adapters"

[tool.hatch.build.targets.wheel]
packages = ["clawtell_telegram"]
