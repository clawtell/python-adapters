name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Sync workspace + dev deps
        run: uv sync --all-packages --group dev

      - name: Install package extras for tests
        run: |
          uv pip install -e ./core
          uv pip install -e ./hermes
          uv pip install -e ./langgraph
          uv pip install -e ./telegram

      - name: Run tests
        run: uv run pytest -v
