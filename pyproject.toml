[tool.uv.workspace]
members = ["core", "hermes", "langgraph", "telegram"]

[tool.uv.sources]
clawtell-core = { workspace = true }
clawtell-hermes = { workspace = true }
clawtell-langgraph = { workspace = true }
clawtell-telegram = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "langgraph>=1.0,<2.0",
    "langchain-core>=0.3,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib mode avoids the module-name collision that fires when multiple
# package directories each ship a ``tests/conftest.py`` (they would otherwise
# both register as ``tests.conftest``). With importlib, conftest files are
# imported by path, not by package name.
importmode = "importlib"
testpaths = ["core/tests", "hermes/tests", "langgraph/tests", "telegram/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
