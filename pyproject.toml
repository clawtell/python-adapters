[tool.uv.workspace]
members = ["core", "hermes", "langgraph", "telegram"]

[tool.uv.sources]
clawtell-core = { workspace = true }
clawtell-hermes = { workspace = true }
clawtell-langgraph = { workspace = true }
clawtell-telegram = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "langgraph>=1.0,<2.0",
    "langchain-core>=0.3,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib mode avoids the module-name collision that fires when multiple
# package directories each ship a ``tests/test_adapter.py``. Without it,
# pytest hashes ``test_adapter`` once and refuses the second collection.
addopts = "--import-mode=importlib"
testpaths = ["core/tests", "hermes/tests", "langgraph/tests", "telegram/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
